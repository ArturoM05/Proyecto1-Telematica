# pibl.conf — Configuración del Proxy Inverso + Balanceador de Carga
# Formato: clave=valor  (sin espacios alrededor del =)
# Líneas que empiezan con # son comentarios.

# Puerto en el que escucha el PIBL
port=8080

# Archivo de log
log_file=pibl.log

# TTL del caché en segundos (pasar como parámetro sobrescribe este valor)
cache_ttl=60

# Backends (formato: backend=host:puerto)
# Añade o quita líneas según cuántos servidores tengas en AWS
backend=127.0.0.1:8081
# backend=127.0.0.1:8082
# backend=127.0.0.1:8083
